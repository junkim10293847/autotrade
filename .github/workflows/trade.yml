name: 자동매매

on:
  schedule:
    # 정각(:00)은 깃허브가 가장 붐벼 실행이 크게 밀리므로 한산한 분(3·13·23·33·43·53분)에 예약
    # 한국 시간 평일 9:03 ~ 15:53 (UTC 0~6시)
    - cron: "3,13,23,33,43,53 0-6 * * 1-5"
  workflow_dispatch: {}   # 앱의 '지금 실행' 버튼 (장 밖이면 연결 확인만)

permissions:
  contents: write

concurrency:
  group: trade
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 토큰 캐시
        uses: actions/cache@v4
        with:
          path: .kis_token_*.json
          key: kis-${{ github.run_id }}
          restore-keys: kis-
      - name: 봇 실행
        env:
          KIS_APP_KEY_DEMO: ${{ secrets.KIS_APP_KEY_DEMO }}
          KIS_APP_SECRET_DEMO: ${{ secrets.KIS_APP_SECRET_DEMO }}
          KIS_ACCOUNT_DEMO: ${{ secrets.KIS_ACCOUNT_DEMO }}
          KIS_APP_KEY_REAL: ${{ secrets.KIS_APP_KEY_REAL }}
          KIS_APP_SECRET_REAL: ${{ secrets.KIS_APP_SECRET_REAL }}
          KIS_ACCOUNT_REAL: ${{ secrets.KIS_ACCOUNT_REAL }}
        run: python bot.py ${{ github.event_name == 'workflow_dispatch' && '--check' || '' }}
      - name: 기록 저장
        run: |
          git config user.name "trade-bot"
          git config user.email "trade-bot@users.noreply.github.com"
          for f in state.json log.md status.json plan.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || (git commit -m "매매 기록 $(date -u +%F' '%H:%M)" && git pull --rebase -q && git push)
